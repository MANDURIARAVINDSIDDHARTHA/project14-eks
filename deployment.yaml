apiVersion: apps/v1
kind: Deployment
metadata:
  name: project14-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: project14-web
  template:
    metadata:
      labels:
        app: project14-web
    spec:
      containers:
      - name: web
        image: 590507089733.dkr.ecr.ap-south-1.amazonaws.com/project14-web:latest
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: project14-svc
spec:
  type: LoadBalancer
  selector:
    app: project14-web
  ports:
  - port: 80
    targetPort: 80
